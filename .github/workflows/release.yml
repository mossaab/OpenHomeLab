name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE_REF: ghcr.io/mossaab/openhomelab

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION (use npm version to bump before tagging)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build source archives
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          tar --exclude=./node_modules --exclude=./dist --exclude=./data \
            --exclude=./.git --exclude=.env \
            -czf "${RUNNER_TEMP}/openhomelab-v${TAG}.tar.gz" .
          mv "${RUNNER_TEMP}/openhomelab-v${TAG}.tar.gz" "openhomelab-v${TAG}.tar.gz"
          zip -qr "openhomelab-v${TAG}.zip" . \
            -x "node_modules/*" "dist/*" "data/*" ".git/*" ".env" "openhomelab-v${TAG}.*"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.ref_name }}
            ${{ env.IMAGE_REF }}:latest

      - name: Generate release notes
        run: gh api -X POST repos/${GITHUB_REPOSITORY}/releases/generate-notes -f tag_name=${GITHUB_REF_NAME} --jq .body > RELEASE_NOTES.md

      - name: Append image digest to release notes
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_REF}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          {
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            fi
            echo ""
            echo "## Docker image"
            echo "- \`${IMAGE_REF}:${GITHUB_REF_NAME}\` — digest \`$DIGEST\`"
            echo "- \`${IMAGE_REF}:latest\` (rolling tag)"
          } > RELEASE_NOTES.tmp && mv RELEASE_NOTES.tmp RELEASE_NOTES.md

      - name: Verify release artifacts
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -s "openhomelab-v${TAG}.tar.gz"
          test -s "openhomelab-v${TAG}.zip"
          test -s RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenHomeLab ${{ github.ref_name }}
          files: |
            ${{ github.workspace }}/openhomelab-v*.tar.gz
            ${{ github.workspace }}/openhomelab-v*.zip
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
          fail_on_unmatched_files: true

      - name: Verify release notes body
        run: |
          REL_ID="$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME} --jq .id)"
          BODY="$(gh api repos/${GITHUB_REPOSITORY}/releases/"$REL_ID" --jq .body)"
          if [ -z "$BODY" ]; then
            echo "Release body empty, patching notes from RELEASE_NOTES.md"
            gh api -X PATCH repos/${GITHUB_REPOSITORY}/releases/"$REL_ID" \
              -f tag_name=${GITHUB_REF_NAME} \
              --field "body=@RELEASE_NOTES.md"
          fi
          BODY="$(gh api repos/${GITHUB_REPOSITORY}/releases/"$REL_ID" --jq .body)"
          if [ -z "$BODY" ]; then
            echo "::error::Release body is still empty after patching"
            exit 1
          fi
          echo "Release notes set (${#BODY} chars)"
