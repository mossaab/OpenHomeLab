name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE_REF: ghcr.io/mossaab/openhomelab

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION (use npm version to bump before tagging)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build source archives
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          tar --exclude=./node_modules --exclude=./dist --exclude=./data \
            --exclude=./.git --exclude=.env \
            -czf "${RUNNER_TEMP}/openhomelab-v${TAG}.tar.gz" .
          mv "${RUNNER_TEMP}/openhomelab-v${TAG}.tar.gz" "openhomelab-v${TAG}.tar.gz"
          zip -qr "openhomelab-v${TAG}.zip" . \
            -x "node_modules/*" "dist/*" "data/*" ".git/*" ".env" "openhomelab-v${TAG}.*"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.ref_name }}
            ${{ env.IMAGE_REF }}:latest

      - name: Generate release notes
        run: gh api -X POST repos/${GITHUB_REPOSITORY}/releases/generate-notes \
          -f tag_name=$GITHUB_REF_NAME --jq .body > RELEASE_NOTES.md

      - name: Append image digest to release notes
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_REF}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          {
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            fi
            echo ""
            echo "## Docker image"
            echo "- \`${IMAGE_REF}:${GITHUB_REF_NAME}\` — digest \`$DIGEST\`"
            echo "- \`${IMAGE_REF}:latest\` (rolling tag)"
          } > RELEASE_NOTES.tmp && mv RELEASE_NOTES.tmp RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenHomeLab ${{ github.ref_name }}
          files: |
            openhomelab-v*.tar.gz
            openhomelab-v*.zip
          bodyFile: RELEASE_NOTES.md
